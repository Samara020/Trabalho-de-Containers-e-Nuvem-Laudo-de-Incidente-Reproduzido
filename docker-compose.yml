services:
  armazenamento:
    build: ./app/armazenamento
    networks:
      - rede_teste
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

  servico:
    build: ./app/servico
    environment:
      - MODO=${MODO:-dividido}
      - MITIGACAO=${MITIGACAO:-nao}
      - MAX_SIMULTANEOS=${MAX_SIMULTANEOS:-4}
    depends_on:
      armazenamento:
        condition: service_healthy
    networks:
      - rede_teste
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3

  gerador:
    build: ./carga
    environment:
      - TOTAL_ITENS=${TOTAL_ITENS:-1000}
      - CONCORRENCIA=${CONCORRENCIA:-16}
      - MITIGACAO=${MITIGACAO:-nao}
      - TAMANHO_LOTE=${TAMANHO_LOTE:-16}
    depends_on:
      servico:
        condition: service_healthy
    networks:
      - rede_teste

networks:
  rede_teste:
    driver: bridge